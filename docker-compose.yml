services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-erp-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-posadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-posadmin_dev_password}
      POSTGRES_DB: ${DB_NAME:-pos_erp_v2}
    ports:
      # Port différent de pos-erp/docker-compose.yml (5432) : les deux
      # projets peuvent tourner en parallèle sans conflit pendant la
      # reconstruction (voir plan — jamais la même base de données).
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pos_erp_v2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-posadmin} -d ${DB_NAME:-pos_erp_v2}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pos-erp-v2-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - pos_erp_v2_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pos-erp-v2-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-posadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-posadmin_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000" # API S3-compatible
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # console web
    volumes:
      - pos_erp_v2_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: pos-erp-v2-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  pos_erp_v2_pgdata:
  pos_erp_v2_redisdata:
  pos_erp_v2_miniodata:
